name: Visual fidelity

on:
  pull_request:
  push:
    branches: [main]

jobs:
  original-screens:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check for tracked review files
        run: |
          files=$(git ls-files -- docs ':!docs/images/portfolio-preview.png')
          if [ -n "$files" ]; then
            printf '%s\n' 'Keep review files out of Git:' "$files"
            exit 1
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:profile
      - run: pnpm visual:audit
