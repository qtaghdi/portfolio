# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# https://docs.coderabbit.ai/reference/configuration
language: ko-KR
tone_instructions: >-
  채용 담당자와 방문자의 사용 경험을 살피는 프론트엔드 동료처럼 간결하고 구체적으로 리뷰하세요.
  문제의 발생 조건, 사용자 영향, 최소 수정안을 설명하고 취향에 따른 디자인 변경이나 근거 없는 추측은 피하세요.

reviews:
  profile: chill
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  collapse_walkthrough: true
  poem: false
  in_progress_fortune: false
  sequence_diagrams: false
  suggested_labels: false
  suggested_reviewers: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
  pre_merge_checks:
    docstrings:
      mode: 'off'
  path_filters:
    - '!node_modules/**'
    - '!.pnpm-store/**'
    - '!.astro/**'
    - '!dist/**'
    - '!playwright-report/**'
    - '!test-results/**'
  path_instructions:
    - path: '**/*'
      instructions: >-
        개인 프론트엔드 포트폴리오인 Astro 4 정적 사이트이며 MDX, TypeScript, SCSS와 pnpm을 사용합니다.
        AGENTS.md를 따르고 변경으로 발생한 실제 결함과 방문자에게 영향을 주는 회귀를 우선하세요.
        소규모 정적 사이트에 서버, 전역 상태 관리, React 전환이나 범용 추상화를 요구하지 마세요.
        포맷이나 개인 취향만의 지적, 기존 문제의 반복, 모든 함수의 주석 및 테스트를 요구하지 마세요.
        성과나 기여에 관한 주장은 저장소 근거로 확인하고 확인할 수 없는 수치는 추측하지 마세요.
        사용자 문구, 문서, 메타데이터에는 em dash와 en dash를 쓰지 않는 규칙을 적용하세요.
    - path: 'src/**/*.astro'
      instructions: >-
        Astro frontmatter의 빌드 시 실행과 브라우저 script 실행을 구분하세요.
        정적 렌더링, 실제 이동 가능한 링크와 앵커, 제목 계층, main landmark, 건너뛰기 링크,
        키보드 조작, focus-visible, 모바일 메뉴의 aria-expanded 및 Escape 동작을 확인하세요.
        이미지 대체 텍스트와 width/height, 원본 비율, 지연 로딩 및 초기 화면 이미지의 로딩 비용을 검토하세요.
        가공되지 않은 외부 HTML 삽입, 브라우저에 노출되는 비밀 값, 불필요한 클라이언트 JS 증가를 지적하세요.
        시각적 문제는 코드상 근거나 실제 화면 증거가 있을 때 설명하고 스크린샷을 보지 않고 색감이나 배치를 단정하지 마세요.
    - path: 'src/styles/**'
      instructions: >-
        기존 SCSS 토큰과 Astro 컴포넌트 스타일을 존중하세요.
        데스크톱과 390px 모바일에서 수평 넘침, 긴 한국어 및 영어 문구 잘림,
        고정 헤더의 앵커 가림, 키보드 포커스, 대비 및 prefers-reduced-motion 회귀를 확인하세요.
        의도적인 서체, 여백, 색상은 취향만으로 변경을 요구하지 마세요.
    - path: 'src/{i18n,pages,layouts}/**'
      instructions: >-
        한국어는 루트, 영어는 /en/ 경로이며 언어 전환 시 같은 프로젝트를 유지해야 합니다.
        localePath와 projectPath, 숫자 접두사를 제거한 slug, getStaticPaths와 번역 자료의 연결을 확인하세요.
        html lang, canonical, hreflang 및 x-default, og:locale, Open Graph와 Twitter 메타데이터가
        페이지와 언어에 맞는 절대 URL을 사용하는지 확인하세요.
        프로젝트별 국문·영문 공유 이미지는 실제 존재하는 서로 다른 1200x630 PNG여야 합니다.
    - path: 'src/{content,i18n,data}/**'
      instructions: >-
        MDX frontmatter는 src/content/config.ts의 Zod 스키마와 일치해야 합니다.
        한국어 MDX와 별도 영어 프로젝트 자료의 사실, 역할, 날짜, 지표, 링크가 서로 모순되지 않는지 확인하세요.
        추적 중인 소스와 README를 근거로 확인하고, 로컬 전용 docs/ 감사 자료가 없다는 이유로 결함을 단정하지 마세요. 과거 기록을 최신 사실로 단정하지 마세요.
        실제 제품 화면, 데모 데이터, 로컬 실행, 설명용 다이어그램의 구분과 출처 문구를 유지하세요.
        project-screens.ts의 이미지 경로, 크기와 국·영문 캡션의 연결을 확인하세요.
    - path: 'src/lib/**'
      instructions: >-
        GitHub 공개 프로필은 빌드 시 한 번 조회하고 timeout, 응답 검증, 안전한 기본값을 유지해야 합니다.
        외부 API 장애나 비정상 응답으로 빌드가 실패하지 않는지, 허용된 프로필 URL과 avatar 호스트가 유지되는지 확인하세요.
        공유 이미지 경로 생성은 실제 locale 및 프로젝트 slug와 일치해야 합니다.
    - path: 'scripts/**'
      instructions: >-
        Notion 동기화에서 토큰 유출, 페이지네이션 누락, MDX 및 YAML 이스케이프,
        파일명 충돌과 기존 수작업 콘텐츠 덮어쓰기를 확인하세요.
        에셋 갱신은 실제 화면과 근거를 보존하고 국·영문 페이지별 공유 카드 및 README 이미지와 일치해야 합니다.
        외부 API나 화면을 실제로 확인하지 않았다면 검증했다고 쓰지 마세요.
    - path: '{tests/**,playwright.visual.config.ts,.github/workflows/**}'
      instructions: >-
        pnpm test:profile은 API 응답과 fallback, pnpm test:social은 빌드 결과의 공유 이미지를 검증하고
        pnpm visual:audit은 빌드, 공유 이미지 검사와 Playwright 데스크톱·모바일 원본 화면 검사를 수행합니다.
        변경한 동작과 관련된 기존 검사를 우선하고 실패를 감추는 skip이나 검증 약화를 지적하세요.
        시각 검사의 원본 이미지 비율과 실제 화면 표시 보장을 유지하세요.
        설정·문구만 바꾸는 작업에 불필요한 E2E 추가를 요구하지 마세요.

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - '**/AGENTS.md'
  learnings:
    scope: local

chat:
  auto_reply: true
  art: false
