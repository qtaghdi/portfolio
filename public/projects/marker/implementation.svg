<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img" aria-labelledby="title desc"><title id="title">Marker 구현 구조 요약</title><desc id="desc">감정과 장소를 연결하는 지도 서비스. 실제 제품 화면이 아닌 구현 구조 설명입니다.</desc><style>text{font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif;fill:#f5f6fa}.eyebrow{font-size:16px;letter-spacing:2px;fill:#ffb5c8}.title{font-size:60px;font-weight:600;letter-spacing:-2px}.subtitle{font-size:27px;fill:#ccd1dd}.number{font-size:17px;fill:#ffb5c8}.step{font-size:29px;font-weight:600}.body{font-size:19px;fill:#b9c1d0}.tag{font-size:22px;fill:#ffb5c8;font-weight:600}.line{font-size:22px;fill:#e0e5ed}.note{font-size:22px;fill:#b9c1d0}</style><rect width="1400" height="840" fill="#28151d"/><path d="M72 94H1328M72 750H1328" stroke="white" stroke-opacity=".16"/><text x="72" y="62" class="eyebrow">IMPLEMENTATION OVERVIEW</text><text x="1328" y="62" text-anchor="end" class="body">구현 구조 요약 · 실제 화면 아님</text><text x="72" y="187" class="title">Marker</text><text x="72" y="242" class="subtitle">감정과 장소를 연결하는 지도 서비스</text><rect x="72" y="292" width="400" height="190" rx="16" fill="white" fill-opacity=".045" stroke="white" stroke-opacity=".16"/><text x="98" y="337" class="number">01</text><text x="98" y="390" class="step">감정 선택</text><text x="98" y="436" class="body">설렘 · 편안함 · 감사</text><path d="M479 382h14m-6-6 6 6-6 6" fill="none" stroke="#ffb5c8" stroke-width="2"/><rect x="500" y="292" width="400" height="190" rx="16" fill="white" fill-opacity=".045" stroke="white" stroke-opacity=".16"/><text x="526" y="337" class="number">02</text><text x="526" y="390" class="step">장소와 연결</text><text x="526" y="436" class="body">지도 · 위치 · 장소 정보</text><path d="M907 382h14m-6-6 6 6-6 6" fill="none" stroke="#ffb5c8" stroke-width="2"/><rect x="928" y="292" width="400" height="190" rx="16" fill="white" fill-opacity=".045" stroke="white" stroke-opacity=".16"/><text x="954" y="337" class="number">03</text><text x="954" y="390" class="step">기록과 탐색</text><text x="954" y="436" class="body">감정 마커 · 장소별 기록</text><text x="72" y="553" class="tag">제12회 하이톤 대상</text><text x="72" y="608" class="line">장소 탐색 → 감정과 기록 입력 → 지도에서 다시 확인</text><text x="72" y="661" class="note">지도에 감정과 장소의 맥락을 함께 남기는 프로젝트입니다.</text><text x="72" y="794" class="body">PARK SANGMIN · PORTFOLIO</text></svg>