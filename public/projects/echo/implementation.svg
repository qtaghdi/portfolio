<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img" aria-labelledby="title desc"><title id="title">Echo 구현 구조 요약</title><desc id="desc">음성 감지 결과와 녹음 상태를 연결한 앱. 실제 제품 화면이 아닌 구현 구조 설명입니다.</desc><style>text{font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif;fill:#f5f6fa}.eyebrow{font-size:16px;letter-spacing:2px;fill:#93e8dc}.title{font-size:60px;font-weight:600;letter-spacing:-2px}.subtitle{font-size:27px;fill:#ccd1dd}.number{font-size:17px;fill:#93e8dc}.step{font-size:29px;font-weight:600}.body{font-size:19px;fill:#b9c1d0}.tag{font-size:22px;fill:#93e8dc;font-weight:600}.line{font-size:22px;fill:#e0e5ed}.note{font-size:22px;fill:#b9c1d0}</style><rect width="1400" height="840" fill="#102321"/><path d="M72 94H1328M72 750H1328" stroke="white" stroke-opacity=".16"/><text x="72" y="62" class="eyebrow">IMPLEMENTATION OVERVIEW</text><text x="1328" y="62" text-anchor="end" class="body">구현 구조 요약 · 실제 화면 아님</text><text x="72" y="187" class="title">Echo</text><text x="72" y="242" class="subtitle">음성 감지 결과와 녹음 상태를 연결한 앱</text><rect x="72" y="292" width="400" height="190" rx="16" fill="white" fill-opacity=".045" stroke="white" stroke-opacity=".16"/><text x="98" y="337" class="number">01</text><text x="98" y="390" class="step">녹음과 권한</text><text x="98" y="436" class="body">Expo · 마이크 수명 관리</text><path d="M479 382h14m-6-6 6 6-6 6" fill="none" stroke="#93e8dc" stroke-width="2"/><rect x="500" y="292" width="400" height="190" rx="16" fill="white" fill-opacity=".045" stroke="white" stroke-opacity=".16"/><text x="526" y="337" class="number">02</text><text x="526" y="390" class="step">실시간 연결</text><text x="526" y="436" class="body">WebSocket · 감지 피드백</text><path d="M907 382h14m-6-6 6 6-6 6" fill="none" stroke="#93e8dc" stroke-width="2"/><rect x="928" y="292" width="400" height="190" rx="16" fill="white" fill-opacity=".045" stroke="white" stroke-opacity=".16"/><text x="954" y="337" class="number">03</text><text x="954" y="390" class="step">그룹과 통계</text><text x="954" y="436" class="body">그룹 관리 · 차트 화면</text><text x="72" y="553" class="tag">제11회 하이톤 우수상</text><text x="72" y="608" class="line">권한 확인 → 연결 → 녹음 → 피드백 → 자원 정리</text><text x="72" y="661" class="note">녹음과 서버 연결이 달라지는 상황을 화면 상태와 함께 다뤘습니다.</text><text x="72" y="794" class="body">PARK SANGMIN · PORTFOLIO</text></svg>