<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img" aria-labelledby="title desc"><title id="title">Jeomjuro 구현 구조 요약</title><desc id="desc">점주 커뮤니티에서 담당한 기능과 공통 기반. 실제 제품 화면이 아닌 구현 구조 설명입니다.</desc><style>text{font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif;fill:#f5f6fa}.eyebrow{font-size:16px;letter-spacing:2px;fill:#c4b5fd}.title{font-size:60px;font-weight:600;letter-spacing:-2px}.subtitle{font-size:27px;fill:#ccd1dd}.number{font-size:17px;fill:#c4b5fd}.step{font-size:29px;font-weight:600}.body{font-size:19px;fill:#b9c1d0}.tag{font-size:22px;fill:#c4b5fd;font-weight:600}.line{font-size:22px;fill:#e0e5ed}.note{font-size:22px;fill:#b9c1d0}</style><rect width="1400" height="840" fill="#191329"/><path d="M72 94H1328M72 750H1328" stroke="white" stroke-opacity=".16"/><text x="72" y="62" class="eyebrow">IMPLEMENTATION OVERVIEW</text><text x="1328" y="62" text-anchor="end" class="body">구현 구조 요약 · 실제 화면 아님</text><text x="72" y="187" class="title">Jeomjuro</text><text x="72" y="242" class="subtitle">점주 커뮤니티에서 담당한 기능과 공통 기반</text><rect x="72" y="292" width="400" height="190" rx="16" fill="white" fill-opacity=".045" stroke="white" stroke-opacity=".16"/><text x="98" y="337" class="number">01</text><text x="98" y="390" class="step">알림·인증</text><text x="98" y="436" class="body">BFF 요청 경계 · 알림 흐름</text><path d="M479 382h14m-6-6 6 6-6 6" fill="none" stroke="#c4b5fd" stroke-width="2"/><rect x="500" y="292" width="400" height="190" rx="16" fill="white" fill-opacity=".045" stroke="white" stroke-opacity=".16"/><text x="526" y="337" class="number">02</text><text x="526" y="390" class="step">글쓰기</text><text x="526" y="436" class="body">편집기 · 입력과 저장</text><path d="M907 382h14m-6-6 6 6-6 6" fill="none" stroke="#c4b5fd" stroke-width="2"/><rect x="928" y="292" width="400" height="190" rx="16" fill="white" fill-opacity=".045" stroke="white" stroke-opacity=".16"/><text x="954" y="337" class="number">03</text><text x="954" y="390" class="step">관리 도구</text><text x="954" y="436" class="body">모더레이션 · 공통 UI</text><text x="72" y="553" class="tag">프론트엔드 기여 범위</text><text x="72" y="608" class="line">사용자 화면 · 관리자 화면 · 공통 패키지</text><text x="72" y="661" class="note">협업 프로젝트의 담당 기능을 요약한 구조입니다.</text><text x="72" y="794" class="body">PARK SANGMIN · PORTFOLIO</text></svg>