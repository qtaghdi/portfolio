<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img" aria-labelledby="title desc"><title id="title">Kivra 구현 구조 요약</title><desc id="desc">터미널과 IDE의 실행 맥락을 한곳으로. 실제 제품 화면이 아닌 구현 구조 설명입니다.</desc><style>text{font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif;fill:#f5f6fa}.eyebrow{font-size:16px;letter-spacing:2px;fill:#a5b4fc}.title{font-size:60px;font-weight:600;letter-spacing:-2px}.subtitle{font-size:27px;fill:#ccd1dd}.number{font-size:17px;fill:#a5b4fc}.step{font-size:29px;font-weight:600}.body{font-size:19px;fill:#b9c1d0}.tag{font-size:22px;fill:#a5b4fc;font-weight:600}.line{font-size:22px;fill:#e0e5ed}.note{font-size:22px;fill:#b9c1d0}</style><rect width="1400" height="840" fill="#15182d"/><path d="M72 94H1328M72 750H1328" stroke="white" stroke-opacity=".16"/><text x="72" y="62" class="eyebrow">IMPLEMENTATION OVERVIEW</text><text x="1328" y="62" text-anchor="end" class="body">구현 구조 요약 · 실제 화면 아님</text><text x="72" y="187" class="title">Kivra</text><text x="72" y="242" class="subtitle">터미널과 IDE의 실행 맥락을 한곳으로</text><rect x="72" y="292" width="400" height="190" rx="16" fill="white" fill-opacity=".045" stroke="white" stroke-opacity=".16"/><text x="98" y="337" class="number">01</text><text x="98" y="390" class="step">실행 수집</text><text x="98" y="436" class="body">Terminal · VS Code · JetBrains</text><path d="M479 382h14m-6-6 6 6-6 6" fill="none" stroke="#a5b4fc" stroke-width="2"/><rect x="500" y="292" width="400" height="190" rx="16" fill="white" fill-opacity=".045" stroke="white" stroke-opacity=".16"/><text x="526" y="337" class="number">02</text><text x="526" y="390" class="step">공통 계약</text><text x="526" y="436" class="body">시작 · 출력 · 종료 이벤트</text><path d="M907 382h14m-6-6 6 6-6 6" fill="none" stroke="#a5b4fc" stroke-width="2"/><rect x="928" y="292" width="400" height="190" rx="16" fill="white" fill-opacity=".045" stroke="white" stroke-opacity=".16"/><text x="954" y="337" class="number">03</text><text x="954" y="390" class="step">로컬 Runs</text><text x="954" y="436" class="body">실행 기록 · 오류 · 해결 노트</text><text x="72" y="553" class="tag">로컬 데스크톱 도구 · 프로토타입</text><text x="72" y="608" class="line">공유 프로토콜 → Rust 수집 → Tauri 화면</text><text x="72" y="661" class="note">캡처 계약, 에디터 연동과 데스크톱 모듈 분리에 기여했습니다.</text><text x="72" y="794" class="body">PARK SANGMIN · PORTFOLIO</text></svg>